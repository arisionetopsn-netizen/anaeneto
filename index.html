<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana 💗 Neto</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #FF8DA1;
    color: white;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    margin-top: 40px;
    font-size: 36px;
  }

  #contador {
    margin-top: 10px;
    font-size: 18px;
  }

  #mensagem {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: 20px;
    background: rgba(0,0,0,0.3);
    padding: 10px 15px;
    border-radius: 10px;
    display: none;
  }

  #player {
    margin-top: 20px;
    width: 100%;
    max-width: 500px;
  }

  button {
    padding: 12px 25px;
    font-size: 16px;
    margin: 10px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: pink;
  }

  .heart {
    position: absolute;
    color: red;
    animation: cair 5s linear infinite;
  }

  @keyframes cair {
    0% { transform: translateY(-100px); }
    100% { transform: translateY(100vh); }
  }
</style>
</head>

<body>

<h1>Ana ❤️ Neto</h1>

<p id="contador"></p>

<button onclick="mostrarMensagem()">Clique aqui 💌</button>
<button onclick="tocarMusica()">Tocar música 🎵</button>

<p id="mensagem">Eu te amo muito 💖 Você é, e sempre será minha princesinha!</p>

<div id="player">
  <iframe id="scPlayer" width="100%" height="166" scrolling="no" frameborder="no"
    src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/xom-xom-318495754/restless-instrumental&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true">
  </iframe>
</div>

<script>
// Mostrar mensagem
function mostrarMensagem() {
  document.getElementById("mensagem").style.display = "block";
}

// Tocar música via SoundCloud postMessage API
function tocarMusica() {
  const iframe = document.getElementById('scPlayer');
  iframe.contentWindow.postMessage(JSON.stringify({ method: 'play' }), '*');
}

// Contador detalhado
let inicio = new Date("2026-03-11T00:00:00");

function atualizarContador() {
  const agora = new Date();
  let diff = agora - inicio;

  let segundos = Math.floor(diff / 1000);
  let minutos = Math.floor(segundos / 60);
  let horas = Math.floor(minutos / 60);
  let dias = Math.floor(horas / 24);

  let anos = Math.floor(dias / 365);
  let meses = Math.floor((dias % 365) / 30);
  let diasRestantes = (dias % 365) % 30;
  let horasRestantes = horas % 24;
  let minutosRestantes = minutos % 60;
  let segundosRestantes = segundos % 60;

  document.getElementById("contador").innerText = 
    `Estamos juntos há ${anos} anos, ${meses} meses, ${diasRestantes} dias, ${horasRestantes}h ${minutosRestantes}m ${segundosRestantes}s 💖`;
}

atualizarContador();
setInterval(atualizarContador, 1000);

// Corações caindo
function criarCoracao() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerText = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 10 + "px";

  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}

setInterval(criarCoracao, 800);
</script>

</body>
</html>
