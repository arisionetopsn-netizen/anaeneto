<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ana 💗 Neto</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #FF8DA1;
    color: white;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    margin-top: 40px;
    font-size: 36px;
  }

  #contador {
    margin-top: 10px;
    font-size: 18px;
  }

  #mensagem {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: 20px;
    background: rgba(0,0,0,0.3);
    padding: 10px 15px;
    border-radius: 10px;
    display: none;
  }

  .heart {
    position: absolute;
    color: red;
    animation: cair 5s linear infinite;
  }

  @keyframes cair {
    0% { transform: translateY(-100px); }
    100% { transform: translateY(100vh); }
  }
</style>
</head>

<body>

<h1>Ana ❤️ Neto</h1>

<p id="contador"></p>

<button onclick="mostrarMensagem()">Clique aqui 💌</button>

<p id="mensagem">Eu te amo muito 💖 Você é, e sempre será minha princesinha!</p>

<audio id="musica" loop>
  <source src="https://raw.githubusercontent.com/arisionetopsn-netizen/anaeneto/main/Restless%20-%20Instrumental_spotdown.org.mp3" type="audio/mpeg">
</audio>

<script>
function mostrarMensagem() {
  document.getElementById("mensagem").style.display = "block";
}

function tocarMusica() {
  const musica = document.getElementById("musica");
  musica.play().catch(() => {
    console.log("Autoplay bloqueado pelo navegador. Clique no botão para tocar a música.");
  });
}

// tentar tocar automaticamente
window.addEventListener('load', () => {
  tocarMusica();
});

// contador detalhado
let inicio = new Date("2026-03-10T00:00:00");

function atualizarContador() {
  const agora = new Date();
  let diff = agora - inicio;

  let segundos = Math.floor(diff / 1000);
  let minutos = Math.floor(segundos / 60);
  let horas = Math.floor(minutos / 60);
  let dias = Math.floor(horas / 24);

  let anos = Math.floor(dias / 365);
  let meses = Math.floor((dias % 365) / 30);
  let diasRestantes = (dias % 365) % 30;
  let horasRestantes = horas % 24;
  let minutosRestantes = minutos % 60;
  let segundosRestantes = segundos % 60;

  document.getElementById("contador").innerText = 
    `Estamos juntos há ${anos} anos, ${meses} meses, ${diasRestantes} dias, ${horasRestantes}h ${minutosRestantes}m ${segundosRestantes}s 💖`;
}

// chama imediatamente e atualiza a cada segundo
atualizarContador();
setInterval(atualizarContador, 1000);

// corações caindo
function criarCoracao() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerText = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 10 + "px";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 5000);
}

setInterval(criarCoracao, 800);
</script>

</body>
</html>
